# ============================================================================
# dsh-web-devtools —— DSH bundle patch
# ============================================================================
# 插件挂载声明：DSH 启动时把本插件插进 profile 的配置树。
#
# 安装（本地开发，link 到源码目录）：
#   - 在 ~/.dsh/profiles/<profile>/package.json 的 dependencies 里加：
#       "dsh-web-devtools": "link:D:/dsh-plugins/dsh-web-devtools"
#   - 在 dsh.profile.bundles 里加 "dsh-web-devtools"
#   - 确保 node_modules/dsh-web-devtools 指向源码目录
# 重启 DSH（或启用 HMR 时保存配置）生效。
#
# ⚠️ `name:` 必须与安装后的包名完全一致。
# ============================================================================

- insert:
    - id: dsh-web-devtools
      name: dsh-web-devtools
      config:
        enabled: true
        # CDP 调试端口：插件用它拉起/连接浏览器；被占用就换一个
        cdpPort: 9333
        # 浏览器 exe；留空 = 自动探测 Edge / Chrome
        browser: ''
        # 浏览器 profile 目录；留空 = %LOCALAPPDATA%\dsh-web-devtools\browser-profile
        userDataDir: ''
        # 默认是否无头（false = 弹出可见窗口，方便看着 agent 操作）
        headless: false
        # CDP 不在线时，读取类工具是否自动拉起浏览器
        autoLaunch: true
        # 截图落在会话工作区的这个子目录
        outSubdir: web-devtools
        # 下载文件落在会话工作区的这个子目录
        downloadSubdir: downloads
        # 是否自动注入页面记录器（点击/输入/请求/DOM 变化）
        autoRecord: true
        # 扩展桥 hub 端口（读「你当前浏览的标签页」用；扩展 popup 里可改）
        hubPort: 9335
        # 插件加载时是否自动拉起 hub（让浏览器扩展一启动就能连上）
        autoStartHub: true
        # 单次操作默认超时（毫秒）
        timeoutMs: 60000
